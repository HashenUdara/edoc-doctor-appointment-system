name: Build, validate and publish hospital website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-production-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Sequential build and Firebase deployment
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v5

      - name: 2. Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 3. Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: 4. Build frontend
        run: npm run build

      - name: 5. Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: 6. Validate Cloud Functions syntax
        working-directory: functions
        run: node --check index.js

      - name: 7. Stop here for pull requests (do not deploy)
        if: github.event_name == 'pull_request'
        run: echo "Build validation passed. Production deployment is only run from main or manually."

      - name: 8. Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 9. Set up Firebase CLI
        if: github.event_name != 'pull_request'
        run: npm install --global firebase-tools

      - name: 10. Deploy Firestore rules, indexes and Storage rules
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_PROJECT_ID: mystudytracker-693d3
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: 11. Deploy Cloud Functions
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_PROJECT_ID: mystudytracker-693d3
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: 12. Publish website to Firebase Hosting
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_PROJECT_ID: mystudytracker-693d3
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: 13. Print published website
        if: github.event_name != 'pull_request'
        run: echo "Firebase Hosting deployment completed for project mystudytracker-693d3."
